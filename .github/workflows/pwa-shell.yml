name: PWA shell checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**"]

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check JavaScript syntax
        run: |
          node --check backend/web/app.js
          node --check backend/web/sw.js
          python -m compileall -q backend
      - name: Validate PWA manifest
        run: python -m json.tool backend/web/manifest.webmanifest > /dev/null
      - name: Check required PWA assets
        run: |
          test -s backend/web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/sw.js
          test -s web/manifest.webmanifest
          test -s web/icon.svg
